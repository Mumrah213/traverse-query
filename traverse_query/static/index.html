<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traverse-Query — browse to an anchor, then query it</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel2: #1c2330; --line: #262d38;
    --text: #e6edf3; --dim: #8b949e; --accent: #58a6ff;
    --people: #58a6ff; --theme: #bc8cff; --genre: #3fb950;
    --universe: #ff7b72; --similar: #d29922; --anchor: #ff7b72;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 20px 120px; }

  /* header + search */
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
  .brand { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .brand small { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .searchwrap { position: relative; flex: 1; min-width: 240px; }
  input[type=text] {
    width: 100%; padding: 9px 13px; border-radius: 8px; font-size: 14.5px;
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .dropdown {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 50;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    margin-top: 4px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  .dropdown div { padding: 8px 13px; cursor: pointer; font-size: 14px; }
  .dropdown div:hover, .dropdown div.sel { background: var(--line); }
  .dropdown .y { color: var(--dim); margin-left: 8px; font-size: 12.5px; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 18px; }
  .quick button {
    background: transparent; border: 1px solid var(--line); color: var(--dim);
    border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer;
  }
  .quick button:hover { color: var(--text); border-color: var(--accent); }

  /* anchor bar */
  .anchorbar {
    background: var(--panel); border: 1px solid var(--universe); border-radius: 12px;
    padding: 12px 16px; margin-bottom: 18px;
  }
  .anchorbar .anhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .anchorbar .anlabel {
    font-size: 10.5px; letter-spacing: .1em; color: var(--anchor); font-weight: 700;
    border: 1px solid var(--universe); border-radius: 999px; padding: 1px 8px;
  }
  .anchorbar .antitle { font-weight: 600; font-size: 15px; }
  .anchorbar .anmeta { color: var(--dim); font-size: 12.5px; }
  .anchorbar .anclear {
    margin-left: auto; background: none; border: none; color: var(--dim);
    font-size: 15px; cursor: pointer; padding: 2px 8px; border-radius: 6px;
  }
  .anchorbar .anclear:hover { color: var(--text); background: var(--panel2); }
  .anchorbar .qrow { display: flex; gap: 8px; margin-top: 10px; }
  .anchorbar .qrow input { flex: 1; }
  .anchorbar .qrow button {
    background: var(--anchor); color: #0e1116; border: none; font-weight: 700;
    border-radius: 8px; padding: 0 16px; cursor: pointer; font-size: 14px;
  }
  .anchorbar .qrow button:disabled { opacity: .45; cursor: not-allowed; }
  .anchorbar .quick { margin: 8px 0 0; }

  /* breadcrumb */
  .trail { display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
           font-size: 13px; color: var(--dim); margin: 4px 0 18px; }
  .trail a { color: var(--dim); text-decoration: none; cursor: pointer; }
  .trail a:hover { color: var(--text); text-decoration: underline; }
  .trail .conn { color: #6e7681; font-size: 12px; }
  .trail .arrow { color: #484f58; }

  /* node card */
  .node {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 20px; margin-bottom: 22px;
  }
  .node h1 { font-size: 26px; margin: 0 0 2px; letter-spacing: -0.015em; }
  .node .meta { color: var(--dim); font-size: 13px; margin-bottom: 8px; }
  .genretags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .genretag {
    background: var(--panel2); border: 1px solid var(--line); color: var(--genre);
    border-radius: 999px; padding: 2px 9px; font-size: 12px;
  }
  .node .overview { color: #b8c2cc; font-size: 14px; margin: 0; }
  .node .rating { color: var(--similar); font-weight: 600; }
  .badge {
    display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim); margin-left: 8px;
  }
  .badge.curated { color: var(--theme); border-color: #4c3a6b; }
  .anchorbtn {
    float: right; background: transparent; border: 1px solid var(--universe);
    color: var(--anchor); border-radius: 999px; padding: 4px 12px; font-size: 12.5px;
    cursor: pointer; margin-top: 4px;
  }
  .anchorbtn:hover { background: var(--anchor); color: #0e1116; }
  .anchorbtn.anchored { background: var(--anchor); color: #0e1116; font-weight: 700; }

  /* connection groups */
  .group { margin-bottom: 20px; }
  .group h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--dim); margin: 0 0 8px; display: flex; align-items: center; gap: 8px;
  }
  .group h2 .note { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: flex; align-items: baseline; gap: 7px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 13px; cursor: pointer; font-size: 13.5px;
    transition: border-color .1s;
  }
  .chip:hover { border-color: var(--c, var(--accent)); }
  .chip .count { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .chip .preview { color: #6e7681; font-size: 12px; max-width: 260px;
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip.people  { --c: var(--people); border-left: 3px solid var(--people); }
  .chip.theme   { --c: var(--theme); border-left: 3px solid var(--theme); }
  .chip.genre   { --c: var(--genre); border-left: 3px solid var(--genre); }
  .chip.sel { border-color: var(--c); background: var(--panel2); }
  .chip .def { color: var(--theme); font-size: 11px; }

  /* similar + universe cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 13px; cursor: pointer; position: relative;
  }
  .card:hover { border-color: var(--similar); }
  .card .t { font-weight: 600; font-size: 14px; }
  .card .m { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .card .why { color: #6e7681; font-size: 11.5px; margin-top: 4px; }
  .card.universe:hover { border-color: var(--universe); }

  /* member panel */
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 22px;
  }
  .panel .phead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .panel .phead h3 { margin: 0; font-size: 16px; }
  .panel .phead .cnt { color: var(--dim); font-size: 13px; }
  .panel .close { margin-left: auto; background: none; border: none; color: var(--dim);
                  font-size: 16px; cursor: pointer; padding: 2px 8px; border-radius: 6px; }
  .panel .close:hover { color: var(--text); background: var(--panel2); }
  ol.members { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  li.member {
    display: flex; align-items: center; gap: 12px; padding: 8px 12px;
    border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
  }
  li.member:hover { border-color: var(--accent); }
  li.member .rank { color: var(--dim); font-size: 12.5px; min-width: 22px;
                    font-variant-numeric: tabular-nums; text-align: right; }
  li.member .body { flex: 1; min-width: 0; }
  li.member .t { font-weight: 600; font-size: 14px; }
  li.member .t .y { color: var(--dim); font-weight: 400; margin-left: 6px; }
  li.member .why { color: #6e7681; font-size: 12px; overflow: hidden;
                   text-overflow: ellipsis; white-space: nowrap; }
  li.member .score { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums;
                     white-space: nowrap; }
  li.member .star { color: var(--similar); }
  .hint { color: #6e7681; font-size: 13px; }
  .status { color: var(--dim); font-size: 13px; min-height: 20px; margin: 6px 0 12px; }

  /* anchored-query results */
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(360px, 44%);
    gap: 20px;
    align-items: start;
  }
  .left { min-width: 0; }
  .right { position: sticky; top: 16px; min-width: 0; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .right { position: static; }
  }

  .results {
    background: var(--panel); border: 1px solid var(--universe); border-radius: 12px;
    padding: 14px 16px;
  }
  .results.flash { animation: flash .5s ease-out; }
  @keyframes flash {
    0% { box-shadow: 0 0 0 2px var(--accent); }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  .results .rhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
                    margin-bottom: 4px; }
  .results .rhead h2 { margin: 0; font-size: 16px; }
  .results .rhead .rsynth { color: var(--dim); font-size: 12.5px; }
  .results .rhead .rsynth code { color: var(--theme); }
  .results .rhead .rmech {
    font-size: 10.5px; color: var(--anchor); text-transform: uppercase;
    letter-spacing: .06em; border: 1px solid var(--universe); border-radius: 999px;
    padding: 1px 8px; vertical-align: middle;
  }
  .rstate { display: flex; align-items: center; gap: 10px; color: var(--dim);
            font-size: 13.5px; padding: 10px 0 4px; }
  .spinner {
    width: 14px; height: 14px; border: 2px solid var(--line);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite; flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .elapsed { font-variant-numeric: tabular-nums; color: var(--dim); }
  .rgroup { margin-top: 12px; }
  .rgroup h3 { margin: 0 0 2px; font-size: 14px; color: var(--accent); }
  .rgroup .rexp { margin: 0 0 8px; color: var(--dim); font-size: 12.5px; }
  .rgroup .rmech { font-size: 10.5px; color: #6e7681; text-transform: uppercase;
                   letter-spacing: .06em; }
  .rnote { margin-top: 10px; color: var(--similar); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Traverse-Query<small>browse to an anchor, then query it</small></div>
    <div class="searchwrap">
      <input type="text" id="q" placeholder="start anywhere — try &quot;apollo 13&quot;" autocomplete="off">
      <div class="dropdown" id="drop" hidden></div>
    </div>
  </header>
  <div class="quick" id="quick">
    <button data-q="apollo 13">Apollo 13</button>
    <button data-q="the wire">The Wire</button>
    <button data-q="die hard">Die Hard</button>
    <button data-q="futurama">Futurama</button>
    <button data-q="the godfather">The Godfather</button>
  </div>

  <div class="anchorbar" id="anchorbar" hidden>
    <div class="anhead">
      <span class="anlabel">ANCHOR</span>
      <span class="antitle" id="antitle"></span>
      <span class="anmeta" id="anmeta"></span>
      <button class="anclear" id="anclear" title="clear the anchor">✕ clear</button>
    </div>
    <div class="qrow">
      <input type="text" id="aq" placeholder="the opposite · like this but 90s · sequel · happier"
             autocomplete="off">
      <button id="aqgo">Query this movie</button>
    </div>
    <div class="quick" id="aqquick">
      <button data-q="the opposite">the opposite</button>
      <button data-q="more like this">more like this</button>
      <button data-q="but from the 90s">but from the 90s</button>
      <button data-q="but funnier">but funnier</button>
      <button data-q="sequel">sequel</button>
    </div>
  </div>

  <div class="status" id="status"></div>
  <div class="layout">
    <div class="left">
      <div class="trail" id="trail" hidden></div>
      <div id="main"></div>
    </div>
    <div class="right">
      <div id="results" hidden></div>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// --- state ----------------------------------------------------------------
// A hop is {type:"node", id} or {type:"connection", kind, value}.
// pushState/popstate give working back/forward over the traversal.
const stack = [];
const KIND_COLOR = {cast:"people", theme:"theme", genre:"genre"};
// The anchored movie: {id, title}. Browse finds it, the query bar uses it.
let anchor = null;

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  return res.json();
}

function pushHop(hop, title) {
  stack.push(hop);
  history.pushState({hop, stack: stack.length}, "", `#/${hopToHash(hop)}`);
  document.title = title + " — Traverse-Query";
  render();
}
function hopToHash(h) {
  if (h.type === "node") return "movie/" + h.id;
  return "conn/" + h.kind + "/" + encodeURIComponent(h.value);
}

// --- anchor ----------------------------------------------------------------
function setAnchor(movie, pushHopToo) {
  const changed = !anchor || anchor.id !== movie.id;
  anchor = {id: movie.id, title: movie.title, year: movie.year, kind: movie.kind};
  if (changed) $("results").hidden = true;  // old results are for the old anchor
  const bar = $("anchorbar");
  bar.hidden = false;
  $("antitle").textContent = movie.title;
  $("anmeta").textContent = movie.year ? `(${movie.year})` : "";
  $("aq").placeholder = `the opposite of ${movie.title} · like this but 90s · sequel · happier`;
  document.querySelectorAll(".anchorbtn").forEach(b =>
    b.classList.toggle("anchored", +b.dataset.id === movie.id));
  if (pushHopToo) pushHop({type: "node", id: movie.id}, movie.title);
}
function clearAnchor() {
  anchor = null;
  $("anchorbar").hidden = true;
  $("results").hidden = true;
  document.querySelectorAll(".anchorbtn").forEach(b => b.classList.remove("anchored"));
}
$("anclear").onclick = clearAnchor;

async function runQuery(text) {
  if (!anchor) return;
  const go = $("aqgo"), status = $("status");
  go.disabled = true;
  status.textContent = "";

  // The results panel goes straight into a visible querying state with a
  // live elapsed counter, so a slow first query reads as "working" rather
  // than "stuck".
  const r = $("results");
  r.hidden = false;
  r.classList.remove("flash");
  const t0 = performance.now();
  r.innerHTML = `<div class="rhead">
      <h2>Special query <span class="rmech">${esc("running…")}</span></h2>
      <span class="rsynth">anchored on <b>${esc(anchor.title)}</b></span>
    </div>
    <div class="rstate">
      <span class="spinner"></span>
      <span>querying ${esc(anchor.title)}…</span>
      <span class="elapsed" id="qelapsed">0.0s</span>
    </div>`;
  const tick = setInterval(() => {
    const el = $("qelapsed");
    if (el) el.textContent = ((performance.now() - t0) / 1000).toFixed(1) + "s";
  }, 200);

  try {
    const d = await api("/api/query", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({query: text, anchor_id: anchor.id, k: 12}),
    });
    clearInterval(tick);
    renderResults(d, (performance.now() - t0) / 1000);
  } catch (err) {
    clearInterval(tick);
    r.innerHTML = `<div class="rstate">✕ query failed: ${esc(err.message)}</div>`;
    status.textContent = "";
  } finally {
    go.disabled = false;
  }
}

function renderResults(d, wall) {
  const r = $("results");
  r.hidden = false;
  r.classList.remove("flash");
  const resp = d.response;
  const elapsed = resp.elapsed_ms ? (resp.elapsed_ms / 1000).toFixed(1) + "s" : wall.toFixed(1) + "s";
  const parts = [];
  parts.push(`<div class="rhead">
      <h2>Special query <span class="rmech">${esc(d.synthesis)}</span></h2>
      <span class="rsynth">searched: <code>${esc(d.query)}</code> · ${elapsed}</span>
    </div>`);

  if (resp.reject) {
    parts.push(`<p class="rnote">${esc(resp.reject)}</p>`);
  } else {
    for (const g of resp.groups) {
      parts.push(`<div class="rgroup">
        <h3>${esc(g.label)} <span class="rmech">${esc(g.mechanism)}</span></h3>
        <p class="rexp">${esc(g.explanation || "")}</p>
        <ol class="members">
          ${g.titles.map((st, i) => {
            const t = st.title;
            return `<li class="member" data-id="${t.id}">
              <span class="rank">${i + 1}</span>
              <span class="body">
                <span class="t">${esc(t.title)}<span class="y">${t.year || ""}</span></span>
                ${st.reason ? `<div class="why">${esc(st.reason)}</div>` : ""}
              </span>
              <span class="score"><span class="star">★</span> ${t.vote_average.toFixed(1)}
                <span class="y">· ${t.vote_count.toLocaleString()}</span></span>
            </li>`;
          }).join("")}
        </ol>
      </div>`);
    }
    if (resp.ambiguity_note) parts.push(`<p class="rnote">${esc(resp.ambiguity_note)}</p>`);
  }

  parts.push(`<p class="rnote"><a style="color:var(--accent);cursor:pointer" id="rclose">✕ close results</a></p>`);
  r.innerHTML = parts.join("");
  void r.offsetWidth;  // restart the flash animation
  r.classList.add("flash");
  $("rclose").onclick = () => { r.hidden = true; };
  // results stay open while browsing: clicking a title walks the LEFT
  // column to that node, so you can inspect a recommendation and come back
  // to the list without re-querying.
  r.querySelectorAll("li.member[data-id]").forEach(li =>
    li.onclick = () => {
      pushHop({type: "node", id: +li.dataset.id},
        li.querySelector(".t").textContent.trim().replace(/\s+\(\d{4}\)$/, ""));
    });
}

// --- breadcrumb ------------------------------------------------------------
function renderTrail() {
  const trail = $("trail");
  if (stack.length <= 1) { trail.hidden = true; trail.innerHTML = ""; return; }
  trail.hidden = false;
  const parts = [];
  for (let i = 0; i < stack.length; i++) {
    const hop = stack[i];
    if (hop.type === "node") {
      if (i > 0) parts.push(`<span class="arrow">›</span>`);
      const cur = i === stack.length - 1;
      parts.push(cur
        ? `<span>${esc(hop.title)}</span>`
        : `<a data-jump="${i}">${esc(hop.title)}</a>`);
    } else {
      parts.push(`<span class="conn">${esc(hop.value)}</span>`);
    }
  }
  parts.push(`<span style="margin-left:auto"><a data-jump="0">↺ start over</a></span>`);
  trail.innerHTML = parts.join(" ");
  trail.querySelectorAll("a[data-jump]").forEach(a =>
    a.onclick = () => { stack.length = +a.dataset.jump + 1; render(); });
}

// --- rendering -------------------------------------------------------------
function render() {
  renderTrail();
  const last = stack[stack.length - 1];
  if (last.type === "connection") renderMembers(last);
  else renderNode(last);
}

function memberWhy(member, hop) {
  // context line for a member card: the connection + the movie's top genre
  const g = (member.genres || []).slice(0, 2).join(" · ");
  return hop.kind === "cast" ? `${esc(hop.value)} · ${esc(g)}`
    : `${esc(member.why)} · ${esc(g)}`;
}

async function renderNode(hop) {
  const main = $("main"), status = $("status");
  status.textContent = "loading node…";
  let d;
  try {
    d = await api("/api/movie?id=" + hop.id);
  } catch (err) {
    status.textContent = "Error: " + err.message; return;
  }
  status.textContent = "";
  hop.title = d.movie.title;
  renderTrail();
  document.title = hop.title + " — Traverse-Query";

  const m = d.movie;
  GRAPH_NODES.set(m.id, m);
  const anchored = anchor && anchor.id === m.id;
  const parts = [];
  parts.push(`<div class="node">
    <button class="anchorbtn ${anchored ? "anchored" : ""}" data-id="${m.id}"
            title="anchor this movie and run queries against it">
      ${anchored ? "✓ anchored" : "⛓ anchor this movie"}</button>
    <h1>${esc(m.title)} ${m.year ? `<span class="meta">(${m.year})</span>` : ""}
      ${m.curated ? `<span class="badge curated">curated</span>` : ""}
      <span class="badge">${esc(m.kind)}</span></h1>
    <div class="meta">★ <span class="rating">${m.vote_average.toFixed(1)}</span>
      · ${m.vote_count.toLocaleString()} votes · popularity ${m.popularity}</div>
    <div class="genretags">${m.genres.map(g => `<span class="genretag">${esc(g)}</span>`).join("")}</div>
    ${m.overview ? `<p class="overview">${esc(m.overview)}</p>` : ""}
  </div>`);

  // people
  if (d.people.length) {
    parts.push(group("People", d.people.map(p => `
      <div class="chip people" data-kind="cast" data-value="${esc(p.name)}" title="${esc(p.preview.map(x => x.title + " (" + x.year + ")").join(" · "))}">
        <span>${esc(p.name)}</span><span class="count">${p.count}</span>
        <span class="preview">${esc(p.preview.map(x => x.title).join(", "))}</span>
      </div>`).join("")));
  } else {
    parts.push(group("People", `<span class="hint">no cast data for this title</span>`));
  }

  // themes
  const def = t => t.centrality >= 0.9 ? `<span class="def" title="defining theme">●</span>` : "";
  parts.push(group(
    `Themes <span class="note">· ${d.theme_source === "curated" ? "curated tags" : "keywords (uncurated title)"}</span>`,
    d.themes.length ? d.themes.map(t => `
      <div class="chip theme" data-kind="theme" data-value="${esc(t.label)}" title="${esc(t.preview.map(x => x.title).join(" · "))}">
        ${def(t)}<span>${esc(t.label)}</span><span class="count">${t.count}</span>
      </div>`).join("") : `<span class="hint">no themes</span>`));

  // genres
  if (d.genres.length) {
    parts.push(group("Genres", d.genres.map(g => `
      <div class="chip genre" data-kind="genre" data-value="${esc(g.name)}">
        <span>${esc(g.name)}</span><span class="count">${g.count}</span>
      </div>`).join("")));
  }

  // universe + similar
  if (d.universe.length) {
    parts.push(group("Universe & franchise", `
      <div class="cards">${d.universe.map(u => `
        <div class="card universe" data-id="${u.id}">
          <div class="t">${esc(u.title)} <span class="m">${u.year || ""}</span></div>
          <div class="why">${esc(u.relation)}</div>
        </div>`).join("")}</div>`));
  }
  parts.push(group(`Similar <span class="note">· ${esc(d.similar_note)}</span>`, `
    <div class="cards">${d.similar.map(s => `
      <div class="card" data-id="${s.id}">
        <div class="t">${esc(s.title)} <span class="m">${s.year || ""}</span></div>
        <div class="why">${esc(s.why)}</div>
      </div>`).join("") || `<span class="hint">none</span>`}</div>`));

  main.innerHTML = parts.join("");
  bindClicks();
}

function group(title, inner) {
  return `<div class="group"><h2>${title}</h2><div class="chips">${inner}</div></div>`;
}

// --- member panel ----------------------------------------------------------
async function renderMembers(hop) {
  const main = $("main"), status = $("status");
  status.textContent = "loading…";
  let d;
  try {
    d = await api("/api/connection?kind=" + encodeURIComponent(hop.kind) +
                  "&value=" + encodeURIComponent(hop.value) + "&limit=60");
  } catch (err) {
    status.textContent = "Error: " + err.message; return;
  }
  status.textContent = "";
  hop.title = `${d.value} (${d.kind})`;
  renderTrail();
  document.title = hop.title + " — Traverse-Query";

  const cls = KIND_COLOR[hop.kind] || "theme";
  main.innerHTML = `
  <div class="panel">
    <div class="phead">
      <h3 style="color:var(--${cls})">${esc(d.value)}</h3>
      <span class="cnt">${d.count.toLocaleString()} title${d.count === 1 ? "" : "s"}</span>
      <button class="close" id="closepanel" title="back to the movie">✕</button>
    </div>
    <ol class="members">
      ${d.members.map((mm, i) => `
        <li class="member" data-id="${mm.id}">
          <span class="rank">${i + 1}</span>
          <span class="body">
            <span class="t">${esc(mm.title)}<span class="y">${mm.year || ""}</span></span>
            <div class="why">${memberWhy(mm, hop)}</div>
          </span>
          <span class="score"><span class="star">★</span> ${mm.vote_average.toFixed(1)}
            <span class="y">· ${mm.vote_count.toLocaleString()}</span></span>
        </li>`).join("")}
    </ol>
  </div>`;
  $("closepanel").onclick = () => { stack.pop(); render(); };
  main.querySelectorAll("li.member").forEach(li =>
    li.onclick = () => pushHop({type: "node", id: +li.dataset.id}, li.querySelector(".t").textContent.trim()));
}

function bindClicks() {
  document.querySelectorAll(".anchorbtn").forEach(b =>
    b.onclick = () => {
      const m = GRAPH_NODES.get(+b.dataset.id);
      if (m) setAnchor(m, false);
    });
  document.querySelectorAll(".chip").forEach(ch => {
    const hop = {type: "connection", kind: ch.dataset.kind, value: ch.dataset.value};
    ch.onclick = () => pushHop(hop, ch.dataset.value);
  });
  document.querySelectorAll(".card[data-id]").forEach(c =>
    c.onclick = () => pushHop({type: "node", id: +c.dataset.id},
      c.querySelector(".t").textContent.trim()));
}

// The anchor button needs year/kind for the bar; keep the last-seen node data.
const GRAPH_NODES = new Map();

// --- search ----------------------------------------------------------------
const qEl = $("q"), drop = $("drop");
let dropIdx = 0, dropHits = [];

function closeDrop() { drop.hidden = true; dropHits = []; }

qEl.addEventListener("input", async () => {
  const q = qEl.value.trim();
  if (!q) { closeDrop(); return; }
  const d = await api("/api/search?q=" + encodeURIComponent(q));
  dropHits = d.hits;
  if (!dropHits.length) { closeDrop(); return; }
  dropIdx = 0;
  drop.hidden = false;
  drop.innerHTML = dropHits.map((h, i) =>
    `<div class="${i === 0 ? "sel" : ""}" data-id="${h.id}">
      ${esc(h.title)}<span class="y">${h.year || ""} · ${esc(h.kind)}</span>
    </div>`).join("");
  drop.querySelectorAll("div").forEach((el, i) =>
    el.onclick = () => { closeDrop(); qEl.value = ""; pushHop({type:"node", id:+el.dataset.id}, dropHits[i].title); });
});

qEl.addEventListener("keydown", e => {
  if (e.key === "Escape") closeDrop();
  if (e.key === "Enter" && dropHits.length) {
    closeDrop(); qEl.value = "";
    const h = dropHits[Math.min(dropIdx, dropHits.length - 1)];
    pushHop({type: "node", id: h.id}, h.title);
  }
  if (e.key === "ArrowDown") { e.preventDefault(); moveDrop(1); }
  if (e.key === "ArrowUp") { e.preventDefault(); moveDrop(-1); }
});
function moveDrop(d) {
  dropIdx = (dropIdx + d + dropHits.length) % dropHits.length;
  [...drop.children].forEach((el, i) => el.classList.toggle("sel", i === dropIdx));
}

document.querySelectorAll(".quick button").forEach(b =>
  b.onclick = () => { qEl.value = b.dataset.q; qEl.dispatchEvent(new Event("input")); });

// anchored-query bar
const aqEl = $("aq"), aqgo = $("aqgo");
function aqGo() {
  const text = aqEl.value.trim();
  if (text) runQuery(text);
}
aqgo.onclick = aqGo;
aqEl.addEventListener("keydown", e => { if (e.key === "Enter") aqGo(); });
document.querySelectorAll("#aqquick button").forEach(b =>
  b.onclick = () => { aqEl.value = b.dataset.q; aqGo(); });

// --- history / boot --------------------------------------------------------
window.addEventListener("popstate", () => {
  const h = location.hash.replace(/^#\//, "");
  const m = h.match(/^movie\/(\d+)/) || h.match(/^conn\/(\w+)\/(.+)$/);
  if (m && m[1]) pushHopFromHash(h);
});
function pushHopFromHash(h) {
  stack.length = 0;
  const parts = h.split("/");
  if (parts[0] === "movie") {
    stack.push({type: "node", id: +parts[1]});
  } else {
    stack.push({type: "connection", kind: parts[1], value: decodeURIComponent(parts[2])});
  }
  render();
}

[project]
name = "traverse-query"
version = "0.1.0"
description = "Browse the movie graph to find an anchor, then query with it as context"
requires-python = ">=3.12"
dependencies = [
    # The query engine: the router's matchers, branches and SearchResponse
    # contract come from the query_to_rec repo, unchanged.
    "query-to-rec @ git+https://github.com/Mumrah213/query-to-rec@main",
]

# Flat layout, but the dev `data/` symlink looks like a top-level package to
# auto-discovery. Pin discovery to the one real package so an editable
# install works next to the symlink.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["traverse_query*"]

[project.scripts]
traverse-query = "traverse_query.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
